name: Einsatzmonitor Screenshot

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node installieren
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Screenshot erstellen
        run: node screenshot.js

      - name: Bild speichern
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add einsatzplan.jpeg
          git commit -m "Aktualisiere Einsatzmonitor Bild" || exit 0
          git push
