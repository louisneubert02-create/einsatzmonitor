name: Einsatzmonitor Screenshot

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
    - name: Repository laden
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

      - name: Node installieren
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Screenshot erstellen
        run: node screenshot.js

- name: Bild speichern
  uses: EndBug/add-and-commit@v9
  with:
    add: "einsatzplan.jpeg"
    message: "Aktualisiere Einsatzmonitor Bild"
